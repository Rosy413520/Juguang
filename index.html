<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>句光 Sentence Atlas</title>
<!-- 构建时 build.py 会把下面这行替换成 style.css 的内容 -->
<style>
/* ========== 颜色和字体：想换风格就改这里 ========== */
:root{
  --bg:#0d1120;        /* 背景：深海军蓝 */
  --bg2:#151c33;       /* 背景渐变的第二个颜色 */
  --card:#f6efe2;      /* 卡片底色：暖米色 */
  --ink:#1a2035;       /* 卡片上的文字颜色 */
  --text:#f2ebdd;      /* 背景上的文字颜色 */
  --muted:#9aa3bb;     /* 次要文字 */
  --gold:#e8b65a;      /* 主色：暖金 */
  --terra:#e07a5a;     /* 强调色：陶土红 */
  --red:#c2452f;       /* 书封上的中文书名 */
  --sage:#97b88e;      /* 记得按钮：鼠尾草绿 */
  --sky:#8fb2cc;       /* 简单按钮：天蓝 */
  --paper:#f3ecdf;     /* 书架页的纸色背景 */
  --night:#12141b;     /* 阅读页背景：近黑 */
  --cream:#f4ead6;     /* 阅读页当前句 / 播放键 */
  /* 英文字体（衬线）与中文字体 */
  --serif:"Iowan Old Style","Palatino","Georgia","Noto Serif","Songti SC","Noto Serif SC","Noto Serif CJK SC",serif;
  --en-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","PingFang SC","Noto Sans SC",sans-serif; /* 阅读页英文 */
  --sans:-apple-system,"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --en-size:24px;      /* 卡片上英文句子的字号 */
  --zh-size:19px;      /* 卡片上中文的字号 */
  --read-size:19px;    /* 阅读页正文字号 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;margin:0;min-height:100%;color:var(--text);font-family:var(--sans)}
html{background:var(--bg)}
body{min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column}
#sky{position:fixed;inset:0;z-index:-1;background:
 radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff6 50%,transparent 51%),
 radial-gradient(1.5px 1.5px at 85% 32%,#ffe9b980 50%,transparent 51%),radial-gradient(1px 1px at 33% 41%,#fff5 50%,transparent 51%),
 radial-gradient(1px 1px at 58% 66%,#fff4 50%,transparent 51%),radial-gradient(1px 1px at 8% 80%,#fff5 50%,transparent 51%),
 radial-gradient(1.5px 1.5px at 92% 88%,#ffe9b960 50%,transparent 51%),
 radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg) 70%)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.view{display:flex;flex-direction:column;flex:1}

/* ---------- 顶栏 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.home-link{display:flex;align-items:center;gap:8px}
.brand b{font-family:var(--serif);font-size:22px;letter-spacing:2px}
.brand small{font-family:var(--serif);font-size:10px;letter-spacing:3px;color:var(--muted)}
.logo{width:28px;height:28px;color:var(--gold);display:inline-flex}
.contact{border:1px solid #ffffff2a;background:none;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--text);white-space:nowrap}
.icon{background:none;border:0;font-size:22px;color:var(--muted);padding:6px}
@media (max-width:360px){.brand small{display:none}}

/* ---------- 子页面标题行 ---------- */
.subhead{display:flex;align-items:center;gap:10px;margin:12px 0 14px}
.subhead .back{width:34px;height:34px;border-radius:50%;border:1px solid #ffffff2a;background:#ffffff0a;font-size:22px;line-height:1;padding:0 0 3px;flex:none}
.subhead b{display:block;font-family:var(--serif);font-size:20px;letter-spacing:1px}
.subhead small{font-size:10px;letter-spacing:2.5px;color:var(--muted)}

/* ---------- 首页 ---------- */
.hello{color:var(--muted);font-size:14px;margin:18px 2px 14px}
.mods{display:flex;flex-direction:column;gap:14px}
/* 首页底部访问统计；脚本未加载时容器保持隐藏，不占空间、不影响离线打开 */
#busuanzi_container_site_pv,
#busuanzi_container_site_uv{display:none}
.site-stats{margin-top:auto;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.4px;line-height:1.6;opacity:.8}
.site-stats:has(#busuanzi_container_site_pv[style], #busuanzi_container_site_uv[style]){padding:28px 2px 0}
.mod{position:relative;display:flex;align-items:center;gap:12px;border-radius:20px;padding:20px 18px;min-height:132px;overflow:hidden;box-shadow:0 14px 30px #0006,inset 0 0 0 1px #ffffff14}
.mod0{background:linear-gradient(135deg,#1d2645,#141a31)}
.mod1{background:var(--card);color:var(--ink)}
.mod2{background:linear-gradient(135deg,#2a2033,#181427)}
.mtxt{flex:1;min-width:0}
.mtxt small{font-size:10px;letter-spacing:2.5px;color:var(--gold)}
.mod1 .mtxt small{color:#a0773a}
.mtxt h2{font-family:var(--serif);font-size:24px;margin:4px 0 6px;letter-spacing:1px}
.mtxt p{margin:0 0 10px;font-size:13px;opacity:.75}
.mtxt em{font-style:normal;font-size:12px;color:var(--gold)}
.mod1 .mtxt em{color:#9a6a2a}
.art{flex:none;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.art-deck span{font-family:var(--serif);font-size:54px;color:var(--gold);opacity:.9}
.art-group svg{width:62px;height:62px;fill:none;stroke:var(--terra);stroke-width:2;stroke-linejoin:round}
.art-shelf{position:relative;width:110px}
.art-shelf i{position:absolute;width:56px;height:76px;border-radius:6px;background-size:cover;background-position:center;box-shadow:0 6px 14px #0004}
.art-shelf i:nth-child(1){left:0;top:16px;transform:rotate(-8deg)}
.art-shelf i:nth-child(2){left:27px;top:6px;z-index:2}
.art-shelf i:nth-child(3){left:54px;top:16px;transform:rotate(8deg)}

/* ---------- 进度条和标签页 ---------- */
.prog{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:4px;border-radius:4px;background:#ffffff1a;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--terra));transition:width .4s}
.tabs{display:flex;background:#ffffff10;border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;color:var(--muted);font-size:15px}
.tabs button.on{background:var(--gold);color:#1a1405;font-weight:600}
main{flex:1;display:flex;flex-direction:column;gap:14px}

/* ---------- 卡片 ---------- */
.card{position:relative;flex:1;min-height:300px;background:var(--card);color:var(--ink);border-radius:20px;padding:44px 22px 40px;display:flex;flex-direction:column;justify-content:center;gap:18px;box-shadow:0 18px 40px #0007,inset 0 0 0 1px #fff5;transition:transform .35s}
.card.flip{animation:flip .35s}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.tag{position:absolute;top:14px;left:18px;right:18px;font-size:12px;color:#8a7a5c;letter-spacing:1px}
.front,.back{text-align:center;line-height:1.45;overflow-wrap:anywhere}
.en{font-family:var(--serif);font-size:var(--en-size)}
.zh{font-size:var(--zh-size);color:#3d4458}
.front.zh{font-size:calc(var(--zh-size) + 5px);color:var(--ink)}
.back{border-top:1px dashed #c9b991;padding-top:18px}
.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:#a8987a}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.pill{border:1px solid #ffffff30;background:#ffffff0d;border-radius:999px;padding:9px 16px;font-size:14px;display:inline-block}
.pill.sm{padding:6px 12px;font-size:13px}
.pill.gold{background:var(--gold);color:#1a1405;border:0;font-weight:600}
.pill.danger{color:#f29a7b;border-color:#f29a7b66}
.pill.wide{width:100%;margin-top:6px;padding:12px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:0;border-radius:14px;padding:12px 4px;font-size:15px;font-weight:600;color:#14182a;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades small{font-size:11px;font-weight:400;opacity:.75}
.g1{background:var(--terra)}.g2{background:var(--gold)}.g3{background:var(--sage)}.g4{background:var(--sky)}
.grades.wait button{opacity:.3;pointer-events:none}
.done{text-align:center;padding:40px 10px}
.done h2{font-family:var(--serif);color:var(--gold)}
.done p{color:var(--muted)}
.shadow .big{font-size:calc(var(--en-size) + 2px);text-align:center;line-height:1.45}
.shadow .zh{text-align:center}
.status{text-align:center;font-size:13px;color:#8a7a5c}
.status.say{color:var(--terra);font-weight:600}
.ctrl .round{width:56px;height:56px;border-radius:50%;border:1px solid #ffffff30;background:#ffffff0d;font-size:20px}
.ctrl .main{width:72px;height:72px;background:var(--gold);color:#1a1405;border:0;font-size:26px}
.opts{font-size:14px;color:var(--muted);gap:16px}
select,input[type=number]{background:#ffffff14;color:var(--text);border:1px solid #ffffff30;border-radius:8px;padding:4px 6px;font:inherit}
input[type=number]{width:80px}
select option{color:#000}
#shTopic{max-width:100%}

/* ---------- 职场英语：系列 ---------- */
.series{display:flex;flex-direction:column;gap:12px}
.ser{display:block;border-radius:18px;padding:16px 16px 14px;background:#ffffff0b;box-shadow:inset 0 0 0 1px #ffffff14;border-left:4px solid var(--c,var(--gold))}
.ser0{--c:var(--gold)}.ser1{--c:var(--terra)}.ser2{--c:var(--sage)}.ser3{--c:#d9a441}.ser4{--c:var(--sky)}
.ser .sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ser b{font-size:18px;letter-spacing:1px}
.ser small{font-family:var(--serif);font-size:12px;color:var(--muted)}
.ser p{margin:8px 0 10px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{height:3px;border-radius:3px;background:#ffffff14;overflow:hidden;margin-bottom:8px}
.sbar i{display:block;height:100%;background:var(--c)}
.ser em{font-style:normal;font-size:12px;color:var(--c)}

/* ---------- 原著阅读：书架（纸色背景） ---------- */
html:has(body.paper){background:var(--paper)}
body.paper{color:var(--ink)}
body.paper #sky{display:none}
body.paper .brand small,body.paper .subhead small{color:#8b8170}
body.paper .contact{border-color:#1a203530;color:var(--ink)}
body.paper .icon{color:#8b8170}
body.paper .subhead .back{border-color:#1a203526;background:#ffffff80}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:26px 16px}
.bk{display:block;min-width:0}
.cover{position:relative;aspect-ratio:3/4;background-color:#e6dcc6;border-radius:16px;background-size:cover;background-position:center bottom;box-shadow:0 14px 26px #3a2a1440,0 2px 6px #3a2a1426;overflow:hidden}
.cover:before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:#00000018}
.ctext{position:absolute;left:0;right:0;top:0;padding:16px 14px 26px 18px;background:linear-gradient(#f6efe2ee 55%,#f6efe200)}
.ctext small{display:block;font-size:8px;letter-spacing:1.6px;color:#6d6455;margin-bottom:7px}
.ctext b{display:block;font-family:var(--serif);font-weight:400;font-size:15px;line-height:1.2;color:#2a2a30}
.ctext i{display:block;font-style:normal;font-size:10px;letter-spacing:2px;color:var(--red);margin-top:5px}
.bk h4{margin:12px 2px 4px;font-size:17px;font-weight:700;color:var(--ink)}
.btags{font-size:12px;color:#7b7262;margin:0 2px 6px}
.bk p{margin:0 2px;font-size:13px;line-height:1.55;color:#4a4a55}
.bprog{margin:6px 2px 0;font-size:11px;color:#a0773a}
.shelf-credit{margin-top:24px;color:#8b8170!important;text-align:center}

/* ---------- 有声阅读（全屏深色） ---------- */
body.inreader{overflow:hidden}
.reader{position:fixed;inset:0;z-index:5;background:radial-gradient(120% 60% at 50% 0%,#1b1f2b,var(--night) 60%);color:var(--cream);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.reader>*{width:100%;max-width:640px;margin-left:auto;margin-right:auto}
.rtop{display:flex;align-items:center;gap:6px;padding:12px 14px 10px}
.rback{border:0;background:none;color:#cfc6b4;font-size:26px;line-height:1;padding:0 6px 4px 0}
.rchap{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;border:0;background:none;text-align:left;padding:4px 0;white-space:nowrap;overflow:hidden}
.rchap b{font-size:15px;color:#efe6d4;flex:none}
.rchap span{font-size:13px;color:#8d8e98;overflow:hidden;text-overflow:ellipsis}
.rchap span:after{content:" ▾";font-size:10px}
.rspark{border:0;background:none;padding:6px;flex:none}
.rspark svg{width:22px;height:22px;fill:var(--gold)}
body.rnozh .rspark svg{fill:#5b5d68}
.rpill{display:inline-flex;align-items:center;gap:6px;border:0;background:#262934;color:#e9e1cf;border-radius:999px;padding:9px 15px;font-size:14px;flex:none}
.rpill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.rscroll{flex:1;overflow-y:auto;padding:4px 18px 30px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rscroll::-webkit-scrollbar{display:none}
body:not(.rlight) .rscroll{-webkit-mask-image:linear-gradient(#000 calc(100% - 70px),transparent);mask-image:linear-gradient(#000 calc(100% - 70px),transparent)}
.rscroll{position:relative}
.rill{background:#f4ecdb;border-radius:18px;overflow:hidden;margin:6px 0 26px;box-shadow:0 10px 30px #0006}
.rill img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.ret{display:none}
.rtext{font-family:var(--en-sans);font-size:var(--read-size);line-height:1.62;color:#5d606c;letter-spacing:.1px}
.rtext .pe{margin:0 0 .9em}
.rtext .pz{display:none}
.rtext .s{transition:color .25s;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rtext .s.on{color:var(--cream)}
.rtext .s.added{text-decoration:underline dotted #c4573a;text-underline-offset:5px}
.rnext{text-align:center;margin:26px 0 10px}
.rzh{min-height:22px;padding:6px 22px 4px;font-size:14px;line-height:1.5;color:#b9ad95;text-align:center;transition:opacity .2s}
.rzh.off,body.rnozh .rzh{opacity:0}
.rbottom{padding:4px 18px calc(env(safe-area-inset-bottom) + 12px)}
.rprog{height:2px;background:#ffffff1c;border-radius:2px;overflow:hidden;margin-bottom:12px}
.rprog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.rctrl{display:flex;align-items:center;justify-content:center;gap:34px}
.rctrl button{border:0;background:none;padding:8px}
.rctrl button svg{width:24px;height:24px;fill:none;stroke:#d9d0bd;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rctrl .rplay{width:78px;height:78px;border-radius:50%;background:var(--cream);box-shadow:0 0 0 8px #2a2c35,0 10px 24px #0008;display:flex;align-items:center;justify-content:center}
.rctrl .rplay svg{width:30px;height:30px;fill:#1c1d24;stroke:none}
.rcap{text-align:center;font-size:12px;color:#8d8e98;margin-top:12px}
.rcap button{border:0;background:none;color:#cfc6b4;padding:2px 4px;font-size:12px}

/* 「看书」模式：浅色纸面、整页可滚动、每段下面有中文 */
body.rlight .reader{background:var(--paper);color:var(--ink)}
body.rlight .rback{color:#5a5448}
body.rlight .rchap b{color:var(--ink)}
body.rlight .rpill{background:#e6dcc8;color:#3a3428}
body.rlight .rtext{color:#26262e;font-family:var(--serif);font-size:calc(var(--read-size) - 1px);line-height:1.7}
body.rlight .rtext .s.on{color:inherit;background:#f0d999}
body.rlight .rtext .pz{display:block;font-family:var(--sans);font-size:14.5px;line-height:1.7;color:#6b6f7d;margin:-.4em 0 1.3em;padding-left:10px;border-left:2px solid #e2d4b3}
body.rlight.rnozh .rtext .pz{display:none}
body.rlight .ret{display:block;font-family:var(--serif);font-size:20px;text-align:center;margin:0 0 18px;color:var(--ink)}
body.rlight .rzh,body.rlight .rbottom{display:none}
body.rlight .rpill{background:#e6dcc8}

/* ---------- 弹层 ---------- */
.sheet{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.panel{width:100%;max-width:560px;background:#161d33;color:var(--text);border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow:auto}
.panel h3{margin:0 0 10px;font-family:var(--serif);color:var(--gold)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #ffffff12;font-size:15px}
.set.col{flex-direction:column;align-items:flex-start}
.set input[type=range]{width:55%}
.seg{display:flex;background:#ffffff10;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;color:var(--muted);font-size:13px}
.seg button.on{background:var(--gold);color:#1a1405}
#voiceSel{max-width:55%}
.credit{font-size:11px;color:var(--muted);line-height:1.6}
.chlist{display:flex;flex-direction:column;max-height:65vh;overflow:auto}
.chlist button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;text-align:left;border:0;border-bottom:1px solid #ffffff10;background:none;padding:12px 4px}
.chlist button b{font-weight:500;font-size:15px}
.chlist button small{color:var(--muted);font-family:var(--serif);font-size:12px;text-align:right}
.chlist button.on b{color:var(--gold)}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:11;padding:24px}
.mbox{width:100%;max-width:320px;background:var(--card);color:var(--ink);border-radius:20px;padding:22px 20px 18px;text-align:center;box-shadow:0 20px 50px #000a}
.mbox h3{margin:0 0 12px;font-family:var(--serif);font-size:20px;letter-spacing:2px}
.mail{margin:0;font-size:15px}
.maillink{border:0;background:none;padding:0;color:var(--red);font-size:15px;text-decoration:underline;text-underline-offset:3px}
.mtip{font-size:12px;color:#8a7a5c;margin:6px 0 16px}
.mbox .pill:not(.gold){border-color:#1a203530;color:var(--ink);background:none}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;z-index:12;max-width:90vw;text-align:center}
.sentbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:#161d33;color:var(--text);border-radius:18px 18px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -10px 30px #0009;z-index:8}
.sb-en{font-family:var(--en-sans);font-size:16px;line-height:1.45;max-height:30vh;overflow:auto;padding-right:30px}
.sb-zh{font-size:14px;color:var(--muted);margin:6px 0 12px;line-height:1.5}
.sentbar .row{justify-content:flex-start;gap:8px}
#sbClose{position:absolute;top:8px;right:10px;border:0;background:none;padding:6px 8px;color:var(--muted)}
/* 网站版：等数据下载时的「加载中…」 */
.lz{display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 20px;color:var(--muted)}
.lz p{margin:14px 0 18px}
.lzspin{display:inline-block;width:26px;height:26px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;opacity:.6;animation:lzspin .9s linear infinite}
@keyframes lzspin{to{transform:rotate(360deg)}}

</style>
</head>
<body>
<div id="sky"></div>

<!-- 顶栏：Logo + 联系我 + 设置 -->
<header class="top">
  <div class="brand">

<!-- 首页：板块列表（由 app.js 里的 MODULES 生成） -->
<section id="homeView" class="view">
  <p class="hello" id="hello"></p>
  <div id="modList" class="mods"></div>
  <p class="site-stats">
    <span id="busuanzi_container_site_pv">本站访问 <span id="busuanzi_value_site_pv"></span> 次</span><span id="busuanzi_container_site_uv"> · 访客 <span id="busuanzi_value_site_uv"></span> 人</span>

<!-- 板块里的子页面标题行（返回 + 标题） -->
<div id="subHead" class="subhead hidden">
  <button id="btnBack" class="back">‹</button>
  <div><b id="subTitle"></b><small id="subEn"></small></div>
</div>

<!-- 职场英语：系列列表 -->
<section id="groupView" class="view hidden"><div id="groupList" class="series"></div></section>

<!-- 原著阅读：书架 -->
<section id="shelfView" class="view hidden"><div id="shelf" class="shelf"></div><p class="credit shelf-credit" id="shelfCredit"></p></section>

<!-- 句子卡组（日常口语 / 职场英语的每个系列共用） -->
<section id="deckView" class="view hidden">
  <div class="prog"><div class="bar"><i id="barFill"></i></div><span id="progTxt"></span></div>
  <nav class="tabs">
    <button data-mode="card" class="on">翻卡片</button>
    <button data-mode="shadow">跟读</button>
  </nav>

  <!-- 翻卡片 -->
  <main id="cardView">
    <div id="card" class="card" tabindex="0">
      <div class="tag" id="cardTag"></div>
      <div class="front" id="front"></div>
      <div class="back" id="back"></div>
      <div class="hint" id="hint">点卡片翻面</div>
    </div>
    <div class="row speak">
      <button class="pill" id="sayUS">🔊 美音</button>
      <button class="pill" id="sayUK">🔊 英音</button>
    </div>
    <div class="grades" id="grades">
      <button data-q="1" class="g1">忘了<small id="iv1"></small></button>
      <button data-q="3" class="g2">模糊<small id="iv3"></small></button>
      <button data-q="4" class="g3">记得<small id="iv4"></small></button>
      <button data-q="5" class="g4">简单<small id="iv5"></small></button>
    </div>
    <div id="done" class="done hidden">
      <h2>今天的任务完成了 ✨</h2>
      <p>明天再来，复习会按你的记忆情况自动安排。</p>
      <button class="pill gold" id="more">再学 10 句新句子</button>
    </div>
  </main>

  <!-- 跟读 -->
  <main id="shadowView" class="hidden">
    <div class="card shadow">
      <div class="tag" id="shNo"></div>
      <div class="en big" id="shEn" lang="en"></div>
      <div class="zh" id="shZh"></div>
      <div class="status" id="shStatus">按 ▶ 开始：先听，停顿时跟着说</div>
    </div>
    <div class="row ctrl">
      <button class="round" id="shPrev">⏮</button>
      <button class="round main" id="shPlay">▶</button>
      <button class="round" id="shNext">⏭</button>
    </div>
    <div class="row opts">
      <label>每句听 <select id="shRep"><option>1</option><option selected>2</option><option>3</option></select> 遍</label>
      <label><input type="checkbox" id="shHideZh"> 隐藏中文</label>
    </div>
    <div class="row opts">
      <label>从第 <input type="number" id="shJump" min="1" inputmode="numeric"> 句 <button class="pill sm" id="shGo">跳转</button></label>
      <select id="shTopic" class="hidden"></select>
    </div>
  </main>
</section>

<!-- 有声阅读（全屏） -->
<section id="readerView" class="reader hidden">
  <div class="rtop">

</div>

/* ---------- SM-2 间隔复习 ---------- */
// q: 1 忘了 / 3 模糊 / 4 记得 / 5 简单。返回新状态，不改原状态。
function schedule(st, q, now){
  var reps = st ? st[0] : 0, ivl = st ? st[1] : 0, ef = st ? st[2] : CONFIG.startEase, lapses = st ? st[4] : 0;
  var due;
  if (q < 3){                         // 忘了：从头来，几分钟后再见
    lapses += reps > 0 ? 1 : 0; reps = 0; ivl = 0;
    ef = Math.max(CONFIG.minEase, ef - 0.2);
    due = now + CONFIG.againMinutes*MIN;
  } else if (q === 3 && reps === 0){  // 还没记住过就「模糊」：十分钟后再见
    due = now + CONFIG.hardFirstMinutes*MIN;
  } else {
    reps += 1;
    if (reps === 1) ivl = q === 5 ? CONFIG.easyFirstDays : CONFIG.firstDays;
    else if (reps === 2) ivl = q === 3 ? Math.ceil(CONFIG.secondDays/2) : CONFIG.secondDays;
    else ivl = Math.max(ivl+1, Math.round(ivl * ef * (q===3 ? CONFIG.hardFactor : q===5 ? CONFIG.easyBonus : 1)));
    ef = Math.max(CONFIG.minEase, ef + 0.1 - (5-q)*(0.08 + (5-q)*0.02));
    due = dayStart(now) + ivl*DAY;   // 到期那天 0 点起就可复习
  }
  return [reps, ivl, +ef.toFixed(2), due, lapses];
}
function fmtIvl(st, now){
  var ms = st[3] - now;
  if (ms < 60*MIN) return Math.max(1, Math.round(ms/MIN)) + '分钟';
  var d = Math.round((st[3] - dayStart(now))/DAY);
  return d < 31 ? d + '天' : d < 365 ? Math.round(d/30) + '个月' : (d/365).toFixed(1) + '年';
}

  for (var k in D.c){

    if (!txt(k)) continue;
    if (st[3] <= now){ due++; if (st[3] < bestDue && k !== cur){ bestDue = st[3]; best = k; } }
    else if (st[0] === 0 && st[3] < learnDue){ learnDue = st[3]; learn = k; } // 正在学、几分钟后到期的
  }
  if (best !== null) return best;
  if (newLeft() > 0 && D.next < N) return String(D.next);
  if (learn !== null) return learn;     // 没别的了，提前把待巩固的拿出来

  return null;
}

  var now = Date.now(), due = 0, seen = 0;

  $('progTxt').textContent = '已学 ' + seen + '/' + N.toLocaleString() + ' · 待复习 ' + due + ' · 新 ' + Math.min(newLeft(), N - D.next);
}

var CHC = {};   // 每章拍平的句子缓存：[英文, 中文, 段落号]

function setCur(i, how){
